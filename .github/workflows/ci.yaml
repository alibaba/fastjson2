name: CI

on:
  push:
    # Restricted to long-lived branches that may receive direct pushes; every
    # other branch reaches CI through the pull_request trigger below. Triggering
    # on all pushes made a branch with an open PR run the whole matrix twice for
    # the same commit (verified on sha 2e6afd5d44, which produced both a push
    # run and a pull_request run), doubling demand on the runner pool.
    branches:
      - main
      - 'release/**'
      - 'v2.1.x*'
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-excluding-paths
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# Lane queueing, not compile or test time, dominates CI wall-clock: a single run
# of 29 lanes once spent 94 minutes end to end while individual lanes only ran
# 3-10 minutes, and one macOS lane waited 1h26m for a runner. Without this block
# every new commit on a PR branch queued a fresh full matrix while the previous
# one still held runners, so stale commits kept saturating the pool.
concurrency:
  group: ci-${{ github.ref }}
  # Only supersede in-flight PR runs. A push to main or a release branch is the
  # record of what was merged, so let it finish even if another push follows.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write  # Allow posting PR comments for coverage reports

env:
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai

jobs:
  test:
    # Two test passes over one build, so the budget covers a full rebuild plus
    # the retry path (build+test ~9 min on windows, doubled by the retry, plus
    # the reflect pass).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        java: [ 8, 11, 17, 21, 25 ]
        os: [ ubuntu-24.04, windows-latest, macos-latest ]
        exclude:
          # Exclude JDK 25 on macOS (not yet supported)
          - java: 25
            os: macos-latest
    name: Test JDK ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build with Maven and test (default + reflect creator)
        # This job absorbed the former test-reflect job, which repeated the
        # entire 17-module build and differed only by -Dfastjson2.creator=reflect
        # at test time. Running the suite twice over one build halves the lane
        # count (28 -> 14), which is what relieves the runner queue.
        #
        # shell: bash is required, not cosmetic. The default shell on
        # windows-latest is pwsh, where `|| { ... }` does not invoke the block
        # and `VAR=value cmd` is not valid syntax, so the mirror fallback below
        # silently does nothing (confirmed: the windows test lanes run under
        # C:\Program Files\PowerShell\7\pwsh.EXE).
        shell: bash
        run: |
          # Retry once on failure: a stalled dependency download now fails fast
          # (see .mvn/maven.config) and the retry resumes from the partially
          # populated ~/.m2. MVNW_REPOURL lets the Maven wrapper itself fall back
          # to the GCS Maven Central mirror when repo.maven.apache.org is
          # unreachable from the runner (observed on windows-latest).
          mvnw_with_retry() {
            ./mvnw -V --no-transfer-progress "$@" || {
              echo "::warning::Maven build failed; retrying once with the GCS Maven Central mirror as fallback"
              sleep 10
              MVNW_REPOURL=https://maven-central.storage-download.googleapis.com/maven2 ./mvnw -V --no-transfer-progress "$@"
            }
          }

          mvnw_with_retry -Pgen-javadoc -Pgen-dokka clean package

          # Second pass re-runs the suite in reflect mode without `clean`, so it
          # reuses the compiled classes: ~38s of lifecycle overhead across the
          # 17-module reactor plus the tests themselves.
          #
          # This must be the `test` phase, not a bare `surefire:test` goal. A
          # bare goal never runs `package` for the sibling modules, so Maven's
          # ReactorReader has no artifact to serve for them and resolution dies
          # with "Could not find artifact
          # com.alibaba.fastjson2:fastjson2:jar:2.0.66-SNAPSHOT" even though the
          # jar is sitting in core/target/ from the first pass.
          #
          # No retry here: the first pass already resolved every dependency, so
          # a failure is a real test failure and re-running would only delay
          # reporting it.
          ./mvnw -V --no-transfer-progress -Dfastjson2.creator=reflect test

  coverage:
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for better coverage analysis

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 11
          cache: maven

      - name: Build with Maven and generate coverage
        # Same transient-download retry as the test job.
        run: |
          ./mvnw -V --no-transfer-progress clean package || {
            echo "::warning::Maven build failed; retrying once with the GCS Maven Central mirror as fallback"
            sleep 10
            MVNW_REPOURL=https://maven-central.storage-download.googleapis.com/maven2 ./mvnw -V --no-transfer-progress clean package
          }
        env:
          CI: true  # Explicitly set CI to ensure JaCoCo profile is activated

      - name: Upload coverage to Codecov
        # v5 runs natively on the Node.js 24 runtime; v4 targets Node 20, which
        # runners now force onto Node 24, where the upload intermittently dies
        # with EPROTO SSL handshake errors that fail the step despite
        # fail_ci_if_error: false.
        uses: codecov/codecov-action@v5
        with:
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: false
          verbose: true
